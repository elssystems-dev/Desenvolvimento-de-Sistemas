name: star_phrases
description: "API fetcher for famous quotes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cloud_firestore: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/star_phrases.png

flutter_launcher_icons:
  android: true
  image_path: assets/star_phrases.png
  adaptive_icon_background: "#2df8d830"
  adaptive_icon_foreground: assets/star_phrases.png

flutter_native_splash:
  color: "#2df8d830"
  image: assets/star_phrases.png
  android: true
  android_12:
    color: "#2df8d830"
    image: assets/star_phrases.png
